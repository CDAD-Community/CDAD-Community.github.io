<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CDAD - Context-Driven AI Development</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        header {
            padding: 60px 20px;
        }

        .logo {
            width: 180px;
            height: auto;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 48px;
            margin: 10px 0;
        }

        h2 {
            font-weight: normal;
            color: #94a3b8;
        }

        p {
            font-size: 20px;
            color: #cbd5e1;
        }

        .buttons {
            margin-top: 35px;
        }

        .button {
            display: inline-block;
            padding: 14px 25px;
            margin: 8px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            background: #2563eb;
        }

        .button.github {
            background: #334155;
        }
    </style>
</head>

<body>

    <header>

        <img src="cdad.png"
             alt="CDAD Logo"
             class="logo">

        <h1>CDAD</h1>

        <h2>Context-Driven AI Development</h2>

        <p>
            Govern the context.<br>
            Guide the agent.<br>
            Protect the software.
        </p>

        <div class="buttons">

            <a class="button"
               href="https://github.com/mgriott/cdad-bootstrap">
                Get Started
            </a>

            <a class="button github"
               href="https://github.com/mgriott/cdad-bootstrap">
                GitHub
            </a>

        </div>

    </header>

</body>
</html>

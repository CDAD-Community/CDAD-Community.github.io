<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDAD — Context-Driven AI Development</title>
    <meta name="description" content="CDAD is a governance approach for AI-assisted software development combining specifications, context engineering, and protection patterns.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://mgriott.github.io/cdad-site/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mgriott.github.io/cdad-site/">
    <meta property="og:title" content="CDAD — Context-Driven AI Development">
    <meta property="og:description" content="A governance approach for AI-assisted software development with AI coding agents.">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #07111f;
            color: #e5edf7;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .content {
            max-width: 600px;
        }
        h1 {
            font-size: clamp(42px, 8vw, 72px);
            line-height: 1.2;
            letter-spacing: -2px;
            margin-bottom: 20px;
            color: #60a5fa;
        }
        p {
            font-size: 18px;
            color: #94a9bf;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        .button {
            padding: 13px 23px;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            transition: 0.2s;
            display: inline-block;
        }
        .button-primary {
            background: #2563eb;
            color: white;
        }
        .button-primary:hover {
            background: #3b82f6;
            transform: translateY(-2px);
        }
        .button-secondary {
            border: 1px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.03);
            color: #aebed1;
        }
        .button-secondary:hover {
            background: rgba(255,255,255,.08);
        }
        .messages {
            font-size: 13px;
            color: #8fa4ba;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>CDAD</h1>
        <p>Context-Driven AI Development</p>
        <div class="buttons">
            <a href="/cdad-site/en/" class="button button-primary">English</a>
            <a href="/cdad-site/es/" class="button button-secondary">Español</a>
        </div>
        <div class="messages">
            <p id="detection-message"></p>
        </div>
    </div>

    <script>
        // Auto-detect and redirect if appropriate
        (function() {
            const browserLang = navigator.language.split('-')[0];
            const isSpanish = browserLang === 'es';
            const msg = document.getElementById('detection-message');

            if (isSpanish) {
                msg.textContent = 'Redirección automática en 3 segundos... (Detected: Spanish)';
                setTimeout(() => {
                    window.location.href = '/cdad-site/es/';
                }, 3000);
            } else {
                msg.textContent = 'Redirecting to English in 3 seconds... (Detected: ' + browserLang + ')';
                setTimeout(() => {
                    window.location.href = '/cdad-site/en/';
                }, 3000);
            }
        })();
    </script>
</body>
</html>
